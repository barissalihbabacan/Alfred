name: Deploy to Firebase (Hosting & Functions)

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "src/**"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Unit Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      # firebase.json also runs this as the functions predeploy hook; building
      # here too keeps a bundle failure in its own, readable step.
      - name: Build Functions Bundle
        run: npm run build --prefix functions

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUTLER_ALFRED }}

      - name: Deploy Hosting and Cloud Functions
        run: npx firebase-tools deploy --only hosting,functions --non-interactive
