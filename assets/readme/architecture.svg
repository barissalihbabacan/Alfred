<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Bir mesajın yolculuğu</title>
  <desc id="arch-desc">Tarayıcıdaki Next.js uygulaması Google girişi ve App Check token'ıyla api Cloud Function'ına istek atar. Fonksiyon kimliği doğrular, istemi kurar, Groq, Gemini ve OpenRouter sırasıyla denenerek cevap SSE ile akıtılır. Arka planda saat aracı çalışır ve kalıcı bilgiler gizli bilgi filtresinden geçip Gemini embedding ile Firestore'a yazılır.</desc>

  <rect width="1200" height="640" rx="24" fill="#0E1726"/>

  <text x="48" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#C9A45C">BİR MESAJIN YOLCULUĞU</text>

  <!-- üst sıra: istek yolu -->
  <g id="request-path" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- 1 tarayıcı -->
    <g transform="translate(48 96)">
      <rect width="252" height="220" rx="16" fill="#16233A" stroke="#26344D"/>
      <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C9A45C">01</text>
      <text x="24" y="82" font-size="24" font-weight="600" fill="#F4EFE3">Tarayıcı</text>
      <text x="24" y="120" font-size="20" fill="#C8CEDA">Next.js statik uygulama</text>
      <text x="24" y="150" font-size="20" fill="#C8CEDA">Google ile giriş</text>
      <text x="24" y="180" font-size="20" fill="#C8CEDA">App Check token'ı</text>
    </g>
    <!-- 2 kapı -->
    <g transform="translate(332 96)">
      <rect width="252" height="220" rx="16" fill="#16233A" stroke="#26344D"/>
      <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C9A45C">02</text>
      <text x="24" y="82" font-size="24" font-weight="600" fill="#F4EFE3">api fonksiyonu</text>
      <text x="24" y="120" font-size="20" fill="#C8CEDA">ID token + tek UID</text>
      <text x="24" y="150" font-size="20" fill="#C8CEDA">App Check zorunlu</text>
      <text x="24" y="180" font-size="20" fill="#C8CEDA">Secret Manager</text>
    </g>
    <!-- 3 model zinciri -->
    <g transform="translate(616 96)">
      <rect width="252" height="220" rx="16" fill="#16233A" stroke="#C9A45C" stroke-opacity="0.6"/>
      <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C9A45C">03</text>
      <text x="24" y="82" font-size="24" font-weight="600" fill="#F4EFE3">Model zinciri</text>
      <text x="24" y="120" font-size="20" fill="#F4EFE3">Groq gpt-oss-120b</text>
      <text x="24" y="150" font-size="20" fill="#C8CEDA">↓ Gemini 3.8 Flash</text>
      <text x="24" y="180" font-size="20" fill="#C8CEDA">↓ OpenRouter</text>
    </g>
    <!-- 4 cevap -->
    <g transform="translate(900 96)">
      <rect width="252" height="220" rx="16" fill="#16233A" stroke="#26344D"/>
      <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C9A45C">04</text>
      <text x="24" y="82" font-size="24" font-weight="600" fill="#F4EFE3">Akışlı cevap</text>
      <text x="24" y="120" font-size="20" fill="#C8CEDA">SSE: thinking · chunk</text>
      <text x="24" y="150" font-size="20" fill="#C8CEDA">sesli okuma (tarayıcı)</text>
      <text x="24" y="180" font-size="20" fill="#C8CEDA">Türkçe / İngilizce</text>
    </g>
    <!-- oklar -->
    <g stroke="#C9A45C" stroke-width="2" fill="none">
      <path d="M302 206 H328"/><path d="M322 200 L330 206 L322 212"/>
      <path d="M586 206 H612"/><path d="M606 200 L614 206 L606 212"/>
      <path d="M870 206 H896"/><path d="M890 200 L898 206 L890 212"/>
    </g>
  </g>

  <!-- alt sıra: arka plan -->
  <text x="48" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#8A94A6">ARKA PLANDA</text>
  <g id="background-work" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(48 408)">
      <rect width="348" height="184" rx="16" fill="#131F33" stroke="#26344D"/>
      <text x="24" y="44" font-size="22" font-weight="600" fill="#F4EFE3">İstem</text>
      <text x="24" y="82" font-size="20" fill="#C8CEDA">kâhya personası</text>
      <text x="24" y="112" font-size="20" fill="#C8CEDA">+ profil özeti (users/*.md)</text>
      <text x="24" y="142" font-size="20" fill="#C8CEDA">+ ilgili anılar · ~2.100 token</text>
    </g>
    <g transform="translate(426 408)">
      <rect width="348" height="184" rx="16" fill="#131F33" stroke="#26344D"/>
      <text x="24" y="44" font-size="22" font-weight="600" fill="#F4EFE3">Araç</text>
      <text x="24" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C9A45C">get_current_time</text>
      <text x="24" y="112" font-size="20" fill="#C8CEDA">tek çağrıda 6 şehre kadar</text>
      <text x="24" y="142" font-size="20" fill="#C8CEDA">Türkçe şehir adları</text>
    </g>
    <g transform="translate(804 408)">
      <rect width="348" height="184" rx="16" fill="#131F33" stroke="#26344D"/>
      <text x="24" y="44" font-size="22" font-weight="600" fill="#F4EFE3">Bellek</text>
      <text x="24" y="82" font-size="20" fill="#C8CEDA">gpt-oss-20b ile çıkarım</text>
      <text x="24" y="112" font-size="20" fill="#C8CEDA">gizli bilgi filtresi</text>
      <text x="24" y="142" font-size="20" fill="#C8CEDA">Gemini embedding → Firestore</text>
    </g>
    <!-- ince bağlantılar: fonksiyondan arka plana -->
    <g stroke="#26344D" stroke-width="2" fill="none">
      <path d="M458 318 V352 H330 V404"/>
      <path d="M742 318 V352 H600 V404"/>
      <path d="M742 352 H978 V404"/>
    </g>
  </g>
</svg>
