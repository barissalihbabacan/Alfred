<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <title>B.U.T.L.E.R. Alfred — Başlık ve Etkileşim Mimarisi</title>
  <desc>B.U.T.L.E.R. Alfred bilişsel yapay zeka asistanı başlığı ve uçtan uca sesli etkileşim boru hattı şeması</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0e1422" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182235" />
      <stop offset="100%" stop-color="#131c2b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect x="0" y="0" width="1200" height="400" rx="16" fill="url(#bgGrad)" stroke="#23324d" stroke-width="1.5" />

  <!-- Subtle Ambient Background Accents -->
  <circle cx="1050" cy="80" r="180" fill="#c5a059" fill-opacity="0.03" />
  <circle cx="150" cy="320" r="140" fill="#3b82f6" fill-opacity="0.02" />

  <!-- LEFT COLUMN: Identity, Typography & Value -->
  <g transform="translate(60, 50)">
    <!-- Metadata Pill -->
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981" />
    <text x="28" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">BİLİŞSEL YÖNETİCİ ASİSTANI • v0.1.0</text>

    <!-- Project Name -->
    <text x="0" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      B.U.T.L.E.R. <tspan fill="url(#goldGrad)">ALFRED</tspan>
    </text>

    <!-- Acronym Definition -->
    <text x="0" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Barış's Unified Task, Logic, Execution &amp; Reasoning
    </text>

    <!-- Description -->
    <text x="0" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" line-height="1.5">
      <tspan x="0" dy="0">İngiliz kâhyası disiplininde, sakin ve ölçülü bir üslupla çalışan;</tspan>
      <tspan x="0" dy="24">yerel nöral ses sentezi (Kokoro-82M), Groq LPU akıl yürütme ve</tspan>
      <tspan x="0" dy="24">etkileşimli web ortamına sahip otonom yürütme mimarisi.</tspan>
    </text>

    <!-- Technology Badges -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#162032" stroke="#25354e" stroke-width="1" />
      <text x="14" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Kokoro-82M TTS</text>

      <rect x="140" y="0" width="120" height="30" rx="6" fill="#162032" stroke="#25354e" stroke-width="1" />
      <text x="154" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Groq LPU AI</text>

      <rect x="270" y="0" width="125" height="30" rx="6" fill="#162032" stroke="#25354e" stroke-width="1" />
      <text x="284" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Whisper STT</text>

      <rect x="405" y="0" width="115" height="30" rx="6" fill="#162032" stroke="#25354e" stroke-width="1" />
      <text x="419" y="20" fill="#c5a059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Next.js Web</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Interaction Pipeline Diagram -->
  <g transform="translate(680, 45)">
    <!-- Diagram Card Background -->
    <rect x="0" y="0" width="460" height="310" rx="12" fill="url(#cardGrad)" stroke="#233550" stroke-width="1.2" />

    <!-- Card Header -->
    <rect x="0" y="0" width="460" height="42" rx="12" fill="#1a253a" />
    <path d="M 0 42 L 460 42" stroke="#233550" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="21" r="5" fill="#10b981" opacity="0.8" />
    <text x="75" y="26" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="600">ALFRED CORE PIPELINE</text>
    <text x="350" y="26" fill="#c5a059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ETKİLEŞİM DÖNGÜSÜ</text>

    <!-- Step 1: Input Modalities -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="412" height="46" rx="8" fill="#111a28" stroke="#1f2d45" stroke-width="1" />
      <text x="16" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">1. Çift Giriş Modu</text>
      <text x="180" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Klavye Metni VEYA Canlı Mikrofon</text>
      <text x="375" y="28" fill="#c5a059" font-size="14">⌨ / 🎤</text>
    </g>

    <!-- Connector Down 1 -->
    <path d="M 230 106 L 230 118" stroke="#384c6c" stroke-width="2" stroke-dasharray="2 2" />

    <!-- Step 2: Reasoning & Persona -->
    <g transform="translate(24, 120)">
      <rect x="0" y="0" width="412" height="52" rx="8" fill="#111a28" stroke="#c5a059" stroke-width="1" stroke-opacity="0.6" />
      <text x="16" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">2. Akıl Yürütme &amp; Persona</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Groq Llama-3.3-70B + Alfred Canonical Prompt (docs/persona)</text>
      <rect x="340" y="14" width="60" height="24" rx="4" fill="#292010" stroke="#c5a059" stroke-width="1" />
      <text x="348" y="30" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">LPU 70B</text>
    </g>

    <!-- Connector Down 2 -->
    <path d="M 230 172 L 230 184" stroke="#384c6c" stroke-width="2" stroke-dasharray="2 2" />

    <!-- Step 3: Neural Voice Synthesis -->
    <g transform="translate(24, 186)">
      <rect x="0" y="0" width="412" height="52" rx="8" fill="#111a28" stroke="#1f2d45" stroke-width="1" />
      <text x="16" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">3. Yerel Nöral Ses Sentezi</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Kokoro-82M ONNX • bm_george (İngiliz Kâhyası 24kHz WAV)</text>
      <text x="365" y="32" fill="#10b981" font-size="16">🔊</text>
    </g>

    <!-- Pipeline Status Bottom Bar -->
    <g transform="translate(24, 256)">
      <rect x="0" y="0" width="412" height="36" rx="6" fill="#0d1420" stroke="#1c283c" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#10b981" />
      <text x="34" y="22" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Doğrulandı:</text>
      <text x="108" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">23/23 Test Geçti • Uçtan Uca Sesli Yanıt Aktif</text>
    </g>
  </g>
</svg>
