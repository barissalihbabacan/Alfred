name: CI (Typecheck & Unit Tests)

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:unit

      - name: Install Functions Dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      # functions/index.js + the src/ modules it imports -> functions/lib/index.js.
      # The build itself fails if the api/alfredCallable exports disappear or the
      # bundle imports a package missing from functions/package.json.
      - name: Build Functions Bundle
        run: npm run build --prefix functions

      - name: Check Functions Bundle
        run: npm run check:bundle --prefix functions

      # apps/web is the production front end (static export served by Hosting),
      # so a broken web build must fail CI and therefore block the deploy.
      - name: Web Typecheck
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Web Build (static export)
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
