name: Deploy to Firebase (Hosting & Functions)

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "src/**"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Unit Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install Root Dependencies
        run: npm ci --no-audit --no-fund

      # Hosting serves the static export in apps/web/out (firebase.json
      # hosting.public), so it has to be built before every deploy.
      - name: Build Web App (static export)
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_ALLOWED_UID: ${{ vars.NEXT_PUBLIC_ALLOWED_UID }}
          NEXT_PUBLIC_ALLOWED_EMAIL: ${{ vars.NEXT_PUBLIC_ALLOWED_EMAIL }}

      - name: Verify Static Export
        run: test -f apps/web/out/index.html

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      # firebase.json also runs this as the functions predeploy hook; building
      # here too keeps a bundle failure in its own, readable step.
      - name: Build Functions Bundle
        run: npm run build --prefix functions

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUTLER_ALFRED }}

      - name: Deploy Hosting, Cloud Functions and Firestore rules/indexes
        run: npx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --non-interactive
