name: CI (Typecheck & Unit Tests)

on:
  pull_request:
  # Every push to main is verified too. There is no deploy workflow in this
  # template: each instance deploys itself (see CLAUDE.md, Deployment).
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # tests/ and scripts/ are not in tsconfig.json; vitest only strips types.
      - name: Typecheck Tests & Scripts
        run: npm run typecheck:tests

      - name: Unit Tests
        run: npm run test:unit

      # tests/integration with ALFRED_OFFLINE=1: only the fully local checks run
      # (e.g. the SSH path sandbox); every suite that needs Groq, Ollama, the
      # home-server over SSH or the production API is reported as skipped.
      # No secrets, no network, no live LLM, never production.
      - name: Integration Tests (offline)
        run: npm run test:integration:offline

      - name: Install Functions Dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      # functions/index.js + the src/ modules it imports -> functions/lib/index.js.
      # The build itself fails if the api/alfredCallable exports disappear or the
      # bundle imports a package missing from functions/package.json.
      - name: Build Functions Bundle
        run: npm run build --prefix functions

      - name: Check Functions Bundle
        run: npm run check:bundle --prefix functions

      # apps/web is the production front end (static export served by Hosting),
      # so a broken web build must fail CI. No NEXT_PUBLIC_FIREBASE_* values are
      # set here: the build-time config check only runs on deploy (firebase.json
      # hosting predeploy sets VALIDATE_FIREBASE_CONFIG=true).
      - name: Web Typecheck
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Web Build (static export)
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo Test (crates/setup-core)
        run: cargo test --manifest-path crates/setup-core/Cargo.toml

      - name: Cargo Clippy (crates/setup-core)
        run: cargo clippy --manifest-path crates/setup-core/Cargo.toml -- -D warnings

      - name: Cargo Test (crates/alfred-setup)
        run: cargo test --manifest-path crates/alfred-setup/Cargo.toml

      - name: Cargo Clippy (crates/alfred-setup)
        run: cargo clippy --manifest-path crates/alfred-setup/Cargo.toml --all-targets -- -D warnings
