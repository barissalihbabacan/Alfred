<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">B.U.T.L.E.R. Alfred — Barış'ın kişisel yapay zeka kâhyası</title>
  <desc id="hero-desc">Solda proje adı ve tanımı; sağda canlı sistemden iki gerçek konuşma: Alfred üretim veritabanını silme önerisine itiraz ediyor ve tek araç çağrısıyla Londra, Tokyo ve Sidney saatlerini veriyor.</desc>

  <!-- zemin -->
  <rect width="1200" height="480" rx="24" fill="#0E1726"/>
  <rect x="56" y="60" width="4" height="360" rx="2" fill="#C9A45C" opacity="0.55"/>

  <!-- başlık bloğu -->
  <g id="title-block" transform="translate(88 0)">
    <!-- hizmet zili motifi -->
    <g transform="translate(0 72)" fill="#C9A45C">
      <rect x="11" y="0" width="6" height="6" rx="3"/>
      <path d="M2 21 C2 11 7.5 6 14 6 C20.5 6 26 11 26 21 Z"/>
      <rect x="0" y="22" width="28" height="3.5" rx="1.75"/>
    </g>
    <text x="40" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#C9A45C">KİŞİSEL YAPAY ZEKA KÂHYASI</text>

    <text x="0" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#F4EFE3">Alfred</text>
    <text x="4" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#C9A45C">B.U.T.L.E.R.</text>
    <text x="4" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8A94A6">Barış's Unified Task, Logic, Execution &amp; Reasoning</text>

    <text x="0" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#F4EFE3">Barış'ın asistanı: konuşur, hatırlar,</text>
    <text x="0" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#F4EFE3">tehlikeli bir isteğe kibarca itiraz eder.</text>

    <text x="0" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A94A6">Groq → Gemini → OpenRouter</text>
    <text x="0" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A94A6">Firebase · tek kullanıcı</text>
  </g>

  <!-- gerçek konuşma kartı -->
  <g id="real-conversation" transform="translate(600 40)">
    <rect width="552" height="400" rx="18" fill="#16233A" stroke="#26344D"/>
    <text x="28" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#8A94A6">GERÇEK KONUŞMA · 24 EYL 2026</text>

    <!-- 1: itiraz -->
    <g transform="translate(0 62)">
      <rect x="248" y="0" width="276" height="42" rx="12" fill="#26344D"/>
      <text x="386" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#F4EFE3">Prod veritabanını silelim mi?</text>

      <rect x="28" y="56" width="4" height="84" rx="2" fill="#C9A45C"/>
      <text x="46" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F4EFE3">Hayır, Barış Bey. Üretim veritabanını</text>
      <text x="46" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F4EFE3">silmek geri dönüşü olmayan veri kaybına</text>
      <text x="46" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F4EFE3">ve hizmet kesintisine yol açar…</text>
    </g>

    <!-- 2: araç çağrısı -->
    <g transform="translate(0 222)">
      <rect x="168" y="0" width="356" height="42" rx="12" fill="#26344D"/>
      <text x="346" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#F4EFE3">Londra, Tokyo ve Sidney'de saat kaç?</text>

      <rect x="28" y="54" width="496" height="38" rx="8" fill="#0E1726" stroke="#26344D"/>
      <text x="44" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#C9A45C">get_current_time</text>
      <text x="218" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8A94A6">["Londra","Tokyo","Sidney"]</text>

      <rect x="28" y="104" width="4" height="56" rx="2" fill="#C9A45C"/>
      <text x="46" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F4EFE3">Londra'da saat 14:03, Tokyo'da 22:03</text>
      <text x="46" y="154" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F4EFE3">ve Sidney'de 23:03.</text>
    </g>
  </g>
</svg>
