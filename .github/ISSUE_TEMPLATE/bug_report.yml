name: "Bug Report"
description: "Report an issue, regression, or unexpected behavior in Alfred"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and resolve the problem.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Alfred is experiencing the issue?
      options:
        - "functions/ (Cloud Functions, SSE streaming, Auth)"
        - "src/ai/ (Model Failover: Groq / Gemini / Ollama / EVREN)"
        - "src/alfred/ (Vector memory extraction / Persona / Prompt compiler)"
        - "src/data/ (Firestore vector persistence / Similarity)"
        - "apps/web/ (Next.js 16 UI / Voice Playground / PWA)"
        - "tooling/ (Scripts / Build / CI / Docker)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When invoking the time tool for certain cities, the DST calculation fails..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Start the local emulator with `npm run emulators`
        2. Send message '...'
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Error Output
      description: |
        Relevant terminal or browser console logs.
        IMPORTANT: Please ensure NO secrets, API keys, or private tokens are included.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, browser, etc.
      placeholder: "Node.js v22.14.0, macOS 15.2 / Chrome 132"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      options:
        - label: "I have confirmed that no secrets or API keys are exposed in this report."
          required: true
        - label: "I have checked existing issues to ensure this is not a duplicate."
          required: true
