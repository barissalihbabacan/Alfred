<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">B.U.T.L.E.R. Alfred — Katmanlı Sistem Mimarisi</title>
  <desc id="arch-desc">Persona, Bilişsel Bellek, Kontrol Düzlemi, Hibrit Yapay Zeka, SSE Gerçek Zamanlı Akış, Google Sign-In Güvenliği ve Firebase Dağıtım mimarisi katmanları.</desc>
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#0a0f1b" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f5e6a3" />
    </linearGradient>
    <linearGradient id="secBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111c2e" />
      <stop offset="50%" stop-color="#16253b" />
      <stop offset="100%" stop-color="#111c2e" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect x="0" y="0" width="1200" height="520" rx="20" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(56, 34)">
    <rect x="0" y="0" width="260" height="26" rx="13" fill="#111c2e" stroke="#233550" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#d4af37" />
    <text x="28" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">SİSTEM MİMARİSİ • v0.1.0</text>
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">
      Modüler Katmanlar &amp; Sorumluluk Sınırları
    </text>
  </g>

  <!-- 6 Grid Modules (2 rows of 3) -->
  <g transform="translate(56, 114)">
    <!-- ROW 1, COL 1: Persona & Pushback -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="348" height="152" rx="10" fill="#101827" stroke="#1e2d42" stroke-width="1" />
      <rect x="0" y="0" width="348" height="4" rx="2" fill="#d4af37" />
      <text x="18" y="30" fill="#d4af37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">1. Persona &amp; Koruyucu Duruş</text>
      <text x="18" y="49" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">src/alfred/persona/</text>
      <text x="18" y="76" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
        <tspan x="18" dy="0">• İngiliz kâhyası nezaketi, sakin ve ölçülü üslup</tspan>
        <tspan x="18" dy="21">• Koruyucu Karşı Duruş (Protective Pushback)</tspan>
        <tspan x="18" dy="21">• Yıkıcı ve riskli operasyonlara aktif itiraz</tspan>
      </text>
    </g>

    <!-- ROW 1, COL 2: Cognitive & Vector Memory -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="348" height="152" rx="10" fill="#101827" stroke="#1e2d42" stroke-width="1" />
      <rect x="0" y="0" width="348" height="4" rx="2" fill="#3b82f6" />
      <text x="18" y="30" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">2. Bilişsel &amp; Vektör Bellek</text>
      <text x="18" y="49" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">src/alfred/cognitive/ &amp; src/data/</text>
      <text x="18" y="76" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
        <tspan x="18" dy="0">• Google Gemini text-embedding-004 vektörleri</tspan>
        <tspan x="18" dy="21">• Cloud Firestore kalıcı konuşma &amp; karar kütüğü</tspan>
        <tspan x="18" dy="21">• Hibrit bellek: Kosinüs benzerlik arama motoru</tspan>
      </text>
    </g>

    <!-- ROW 1, COL 3: Control & Execution Plane -->
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="348" height="152" rx="10" fill="#101827" stroke="#1e2d42" stroke-width="1" />
      <rect x="0" y="0" width="348" height="4" rx="2" fill="#8b5cf6" />
      <text x="18" y="30" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">3. Kontrol &amp; İcra Düzlemi</text>
      <text x="18" y="49" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">src/alfred/control-plane/ &amp; execution/</text>
      <text x="18" y="76" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
        <tspan x="18" dy="0">• Otonom görev planlayıcı &amp; tool-router</tspan>
        <tspan x="18" dy="21">• SSH araçları ve güvenli terminal yürütümü</tspan>
        <tspan x="18" dy="21">• Saat/takvim sorgulama &amp; izin hiyerarşisi</tspan>
      </text>
    </g>

    <!-- ROW 2, COL 1: Hybrid AI Inference -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="348" height="152" rx="10" fill="#101827" stroke="#1e2d42" stroke-width="1" />
      <rect x="0" y="0" width="348" height="4" rx="2" fill="#fbbf24" />
      <text x="18" y="30" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">4. Hibrit Yapay Zeka Çekirdeği</text>
      <text x="18" y="49" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">src/ai/providers/ (Groq &amp; Ollama)</text>
      <text x="18" y="76" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
        <tspan x="18" dy="0">• Groq Cloud LPU: Llama-3.3-70B Versatile</tspan>
        <tspan x="18" dy="21">• Yerel Ollama MLX: Gemma 4 derin muhakeme</tspan>
        <tspan x="18" dy="21">• Sağlayıcı bağımsız AIProvider &amp; Registry yapısı</tspan>
      </text>
    </g>

    <!-- ROW 2, COL 2: SSE Stream & Web Speech -->
    <g transform="translate(370, 170)">
      <rect x="0" y="0" width="348" height="152" rx="10" fill="#101827" stroke="#1e2d42" stroke-width="1" />
      <rect x="0" y="0" width="348" height="4" rx="2" fill="#10b981" />
      <text x="18" y="30" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">5. Gerçek Zamanlı Akış &amp; Giriş</text>
      <text x="18" y="49" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">apps/web/public/ &amp; functions/api/</text>
      <text x="18" y="76" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
        <tspan x="18" dy="0">• Server-Sent Events (SSE) ile anlık metin akışı</tspan>
        <tspan x="18" dy="21">• Model muhakeme izolasyonu &amp; "Thinking..." göstergesi</tspan>
        <tspan x="18" dy="21">• Tarayıcı yerel Web Speech API sesli giriş desteği</tspan>
      </text>
    </g>

    <!-- ROW 2, COL 3: Security, Web & Firebase CI/CD -->
    <g transform="translate(740, 170)">
      <rect x="0" y="0" width="348" height="152" rx="10" fill="#101827" stroke="#1e2d42" stroke-width="1" />
      <rect x="0" y="0" width="348" height="4" rx="2" fill="#06b6d4" />
      <text x="18" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">6. Güvenlik, Web &amp; CI/CD</text>
      <text x="18" y="49" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">apps/web/ • functions/ • .github/</text>
      <text x="18" y="76" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
        <tspan x="18" dy="0">• Firebase Auth (Google Sign-In) + App Check</tspan>
        <tspan x="18" dy="21">• Modüler Web: styles.css, app.js, firebase-app.js</tspan>
        <tspan x="18" dy="21">• Cloud Functions (Node 22) + Hosting CI/CD</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Enterprise Security Ribbon -->
  <g transform="translate(56, 452)">
    <rect x="0" y="0" width="1088" height="44" rx="10" fill="url(#secBannerGrad)" stroke="#1e2d42" stroke-width="1" />
    <circle cx="20" cy="22" r="5" fill="#10b981" />
    <text x="36" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      KURUMSAL GÜVENLİK HATTI:
    </text>
    <text x="212" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      reCAPTCHA Enterprise <tspan fill="#38bdf8">──►</tspan> Google Sign-In <tspan fill="#38bdf8">──►</tspan> App Check Enforcement <tspan fill="#38bdf8">──►</tspan> Zero-Trust Karar &amp; Bellek Kütüğü
    </text>
    <rect x="940" y="10" width="134" height="24" rx="12" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" />
    <text x="948" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">● %100 MODÜLER</text>
  </g>
</svg>
