name: Preview (Hosting channel)

# Deploys the web app of a pull request to the fixed Hosting channel
# "preview" and comments its URL on the PR. Only Hosting: /api/** on the
# preview still reaches the production api function (and its data), so this
# is for checking the UI before merging. A fixed channel keeps one URL, which
# has to be added once to Firebase Auth's authorized domains and to the
# reCAPTCHA Enterprise key (docs/OPERATIONS.md, "Preview channel").
on:
  pull_request:
    paths:
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - ".github/workflows/preview.yml"

concurrency:
  group: hosting-preview
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  preview:
    name: Deploy preview
    # Secrets are not available to PRs from forks or Dependabot.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Root Dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Web App (static export)
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_ALLOWED_UID: ${{ vars.NEXT_PUBLIC_ALLOWED_UID }}
          NEXT_PUBLIC_ALLOWED_EMAIL: ${{ vars.NEXT_PUBLIC_ALLOWED_EMAIL }}

      - name: Deploy to the preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUTLER_ALFRED }}
          projectId: butler-alfred
          channelId: preview
          expires: 30d
