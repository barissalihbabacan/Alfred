<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Alfred — End-to-End Architecture &amp; Journey of a Message</title>
  <desc id="arch-desc">Next.js browser client sends requests with Firebase ID token and App Check token to the Cloud Function entrypoint. The function validates dual-whitelist auth, sets up the prompt, and fails over across EVREN, Groq, and Gemini with streaming SSE. Background vector memory extraction and Tavily tools run asynchronously.</desc>

  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#0A101D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#archBg)"/>

  <!-- header -->
  <g transform="translate(48 54)">
    <circle cx="6" cy="6" r="4" fill="#C9A45C"/>
    <text x="22" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="3" fill="#C9A45C">END-TO-END ARCHITECTURE · JOURNEY OF A MESSAGE</text>
  </g>

  <!-- top row: request path -->
  <g id="request-path" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- 01 client -->
    <g transform="translate(48 88)">
      <rect width="252" height="232" rx="16" fill="#16233A" stroke="#26344D"/>
      <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#C9A45C">01</text>
      <text x="24" y="80" font-size="22" font-weight="700" fill="#F4EFE3">Client (Web)</text>
      <text x="24" y="116" font-size="15" fill="#C8CEDA">Next.js 16 (App Router)</text>
      <text x="24" y="142" font-size="15" fill="#C8CEDA">Google Auth (Firebase)</text>
      <text x="24" y="168" font-size="15" fill="#C8CEDA">App Check Attestation</text>
      <text x="24" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8A94A6">apps/web/ (static export)</text>
    </g>

    <!-- 02 gateway -->
    <g transform="translate(332 88)">
      <rect width="252" height="232" rx="16" fill="#16233A" stroke="#26344D"/>
      <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#C9A45C">02</text>
      <text x="24" y="80" font-size="22" font-weight="700" fill="#F4EFE3">Cloud Function</text>
      <text x="24" y="116" font-size="15" fill="#C8CEDA">ALLOWED_EMAIL &amp; UID</text>
      <text x="24" y="142" font-size="15" fill="#C8CEDA">App Check Enforced</text>
      <text x="24" y="168" font-size="15" fill="#C8CEDA">Secret Manager Vault</text>
      <text x="24" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8A94A6">functions/index.ts (2nd Gen)</text>
    </g>

    <!-- 03 model failover chain -->
    <g transform="translate(616 88)">
      <rect width="252" height="232" rx="16" fill="#16233A" stroke="#C9A45C" stroke-width="1.5" stroke-opacity="0.8"/>
      <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#C9A45C">03</text>
      <text x="24" y="80" font-size="22" font-weight="700" fill="#F4EFE3">Model Failover</text>
      <text x="24" y="116" font-size="15" font-weight="600" fill="#F4EFE3">1. Groq (gpt-oss-120b)</text>
      <text x="24" y="142" font-size="15" fill="#C8CEDA">2. Gemini 3.8 Flash</text>
      <text x="24" y="168" font-size="15" fill="#C8CEDA">3. Local Ollama (Gemma)</text>
      <text x="24" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9A45C">zero-downtime failover</text>
    </g>

    <!-- 04 streaming output -->
    <g transform="translate(900 88)">
      <rect width="252" height="232" rx="16" fill="#16233A" stroke="#26344D"/>
      <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#C9A45C">04</text>
      <text x="24" y="80" font-size="22" font-weight="700" fill="#F4EFE3">Streaming SSE</text>
      <text x="24" y="116" font-size="15" fill="#C8CEDA">Server-Sent Events (SSE)</text>
      <text x="24" y="142" font-size="15" fill="#C8CEDA">Thinking &amp; Tool States</text>
      <text x="24" y="168" font-size="15" fill="#C8CEDA">Direct Clickable Citations</text>
      <text x="24" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8A94A6">Bypasses hosting buffers</text>
    </g>

    <!-- connector arrows -->
    <g stroke="#C9A45C" stroke-width="2" fill="none">
      <path d="M300 204 H330"/><path d="M324 198 L332 204 L324 210"/>
      <path d="M584 204 H614"/><path d="M608 198 L616 204 L608 210"/>
      <path d="M868 204 H898"/><path d="M892 198 L900 204 L892 210"/>
    </g>
  </g>

  <!-- bottom row: background intelligence -->
  <g transform="translate(48 368)">
    <circle cx="6" cy="6" r="4" fill="#8A94A6"/>
    <text x="22" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="3" fill="#8A94A6">BACKGROUND INTELLIGENCE &amp; TOOLING</text>
  </g>

  <g id="background-work" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- service 1: prompt -->
    <g transform="translate(48 396)">
      <rect width="348" height="200" rx="16" fill="#131F33" stroke="#26344D"/>
      <text x="24" y="40" font-size="20" font-weight="700" fill="#F4EFE3">Dynamic Prompt (~1,540 Tok)</text>
      <text x="24" y="74" font-size="15" fill="#C8CEDA">User profile digest (users/*.md)</text>
      <text x="24" y="100" font-size="15" fill="#C8CEDA">Honest demeanor &amp; objection rules</text>
      <text x="24" y="126" font-size="15" fill="#C8CEDA">Real-time vector memory retrieval</text>
      <text x="24" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9A45C">npm run profile:init customized</text>
    </g>

    <!-- service 2: tools -->
    <g transform="translate(426 396)">
      <rect width="348" height="200" rx="16" fill="#131F33" stroke="#26344D"/>
      <text x="24" y="40" font-size="20" font-weight="700" fill="#F4EFE3">Time &amp; Live Web Tools</text>
      <text x="24" y="74" font-size="15" fill="#C8CEDA">Tavily: News index auto-selection</text>
      <text x="24" y="100" font-size="15" fill="#C8CEDA">Domain link auto-conversion</text>
      <text x="24" y="126" font-size="15" fill="#C8CEDA">Multi-city timezone &amp; DST resolver</text>
      <text x="24" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8A94A6">Strictly factual verification</text>
    </g>

    <!-- service 3: memory -->
    <g transform="translate(804 396)">
      <rect width="348" height="200" rx="16" fill="#131F33" stroke="#26344D"/>
      <text x="24" y="40" font-size="20" font-weight="700" fill="#F4EFE3">Long-Term Vector Memory</text>
      <text x="24" y="74" font-size="15" fill="#C8CEDA">Asynchronous post-turn extraction</text>
      <text x="24" y="100" font-size="15" fill="#C8CEDA">Secret / credential privacy filter</text>
      <text x="24" y="126" font-size="15" fill="#C8CEDA">Atomic Firestore batch dedup/supersede</text>
      <text x="24" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#10B981">gemini-embedding-001 (768d)</text>
    </g>
  </g>
</svg>
