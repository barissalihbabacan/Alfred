[package]
name = "alfred-setup-core"
version = "0.1.0"
edition = "2021"
description = "WebAssembly core logic for Alfred Setup-UI: validation, state management, and configuration generation"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
