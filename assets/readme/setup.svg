<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Alfred Setup: from a Google account to a live Alfred</title>
  <desc id="desc">The four steps of the Alfred Setup wizard (GCP project, your account, API keys, deploy) next to its live provisioning log: create the project, link billing, enable the APIs, ensure Firestore, provision Secret Manager, deploy, and the final address of the new Alfred.</desc>

  <rect width="1200" height="520" rx="28" fill="#0E1726"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <text x="64" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#C9A45C">ALFRED SETUP  ·  RUST TERMINAL WIZARD  ·  RUNS IN GOOGLE CLOUD SHELL</text>
    <text x="64" y="122" font-size="40" font-weight="700" letter-spacing="-0.5" fill="#F4EFE3">From a Google account to a live Alfred.</text>
    <text x="64" y="160" font-size="20" fill="#C8CEDA">Four steps in the terminal. Keys go to Secret Manager, never into the script.</text>

    <g id="stepper">
      <line x1="84" y1="232" x2="84" y2="436" stroke="#26344D" stroke-width="2"/>
      <g font-size="17" font-weight="700" text-anchor="middle">
        <circle cx="84" cy="226" r="18" fill="#C9A45C"/><text x="84" y="232" fill="#0E1726">1</text>
        <circle cx="84" cy="294" r="18" fill="#C9A45C"/><text x="84" y="300" fill="#0E1726">2</text>
        <circle cx="84" cy="362" r="18" fill="#C9A45C"/><text x="84" y="368" fill="#0E1726">3</text>
        <circle cx="84" cy="430" r="18" fill="#0E1726" stroke="#C9A45C" stroke-width="2.5"/><text x="84" y="436" fill="#C9A45C">4</text>
      </g>
      <text x="120" y="222" font-size="21" font-weight="600" fill="#F4EFE3">GCP project</text>
      <text x="120" y="246" font-size="17" fill="#8A94A6">create or pick one, link billing</text>
      <text x="120" y="290" font-size="21" font-weight="600" fill="#F4EFE3">Your account</text>
      <text x="120" y="314" font-size="17" fill="#8A94A6">the only one allowed to sign in</text>
      <text x="120" y="358" font-size="21" font-weight="600" fill="#F4EFE3">API keys</text>
      <text x="120" y="382" font-size="17" fill="#8A94A6">all optional, add more later</text>
      <text x="120" y="426" font-size="21" font-weight="600" fill="#F4EFE3">Deploy</text>
      <text x="120" y="450" font-size="17" fill="#8A94A6">one click, then watch the log</text>
    </g>

    <g id="console">
      <rect x="560" y="196" width="576" height="276" rx="18" fill="#0A111E" stroke="#26344D" stroke-width="1.5"/>
      <circle cx="590" cy="226" r="5" fill="#10B981"/>
      <text x="604" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#8A94A6">LIVE PROVISIONING LOG</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
        <text x="588" y="270" fill="#C8CEDA"><tspan fill="#C9A45C">› </tspan>Creating the Google Cloud project</text>
        <text x="588" y="298" fill="#C8CEDA"><tspan fill="#C9A45C">› </tspan>Linking the billing account</text>
        <text x="588" y="326" fill="#C8CEDA"><tspan fill="#C9A45C">› </tspan>Enabling Cloud and Firebase APIs</text>
        <text x="588" y="354" fill="#C8CEDA"><tspan fill="#C9A45C">› </tspan>Ensuring the Firestore database</text>
        <text x="588" y="382" fill="#C8CEDA"><tspan fill="#C9A45C">› </tspan>Provisioning the Secret Manager vault</text>
        <text x="588" y="410" fill="#C8CEDA"><tspan fill="#C9A45C">› </tspan>Deploying Hosting, Functions and rules</text>
        <text x="588" y="446" fill="#10B981">✓ Live at https://&lt;project-id&gt;.web.app</text>
      </g>
    </g>
  </g>
</svg>
