<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="ui-title ui-desc">
  <title id="ui-title">B.U.T.L.E.R. Alfred Web Arayüzü (apps/web)</title>
  <desc id="ui-desc">Sol kenar çubuğunda geçmiş sohbetler ve Google ile doğrulanmış kullanıcı bilgisi; sağda Groq openai/gpt-oss-120b model etiketi, hazır durumu, çoklu şehir saati ve kaynak bağlantılı web araması içeren gerçek sohbet ekranı ve alt mesaj kutusu.</desc>

  <!-- dış pencere çerçevesi -->
  <rect width="1200" height="620" rx="20" fill="#212121" stroke="#333333" stroke-width="1.5"/>

  <!-- sol kenar çubuğu (#171717) -->
  <g id="sidebar">
    <path d="M20 0 H290 V620 H20 A20 20 0 0 1 0 600 V20 A20 20 0 0 1 20 0 Z" fill="#171717"/>
    <line x1="290" y1="0" x2="290" y2="620" stroke="#2A2A2A" stroke-width="1"/>

    <!-- marka başlığı -->
    <g transform="translate(20 20)">
      <circle cx="18" cy="18" r="18" fill="#C5A059"/>
      <path d="M9 23 H27 M11 23 V14 A1.5 1.5 0 0 1 12.5 12.5 H23.5 A1.5 1.5 0 0 1 25 14 V23 M11 19.5 H25" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ECECEC">B.U.T.L.E.R. ALFRED</text>
      <text x="48" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#737373">Executive Intelligence</text>
    </g>

    <!-- + Yeni Sohbet butonu -->
    <g transform="translate(16 74)">
      <rect width="258" height="42" rx="10" fill="#222222" stroke="#333333"/>
      <path d="M22 15 V27 M16 21 H28" stroke="#C5A059" stroke-width="2.2" stroke-linecap="round"/>
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#ECECEC">Yeni Sohbet</text>
      <rect x="212" y="11" width="34" height="20" rx="4" fill="#2A2A2A" stroke="#3A3A3A"/>
      <text x="229" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#8E8E8E">⌘K</text>
    </g>

    <!-- Geçmiş Sohbetler -->
    <text x="24" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#737373">GEÇMİŞ SOHBETLER</text>

    <!-- aktif sohbet satırı -->
    <g transform="translate(14 162)">
      <rect width="262" height="40" rx="8" fill="#2A2A2A"/>
      <path d="M24 25 a2 2 0 0 1-2 2 H13 l-3 3 V15 a2 2 0 0 1 2-2 h10 a2 2 0 0 1 2 2 z" fill="none" stroke="#C5A059" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#FFFFFF">Beşiktaş Transfer Gündemi</text>
    </g>

    <!-- diğer sohbet satırları -->
    <g transform="translate(14 208)">
      <path d="M24 25 a2 2 0 0 1-2 2 H13 l-3 3 V15 a2 2 0 0 1 2-2 h10 a2 2 0 0 1 2 2 z" fill="none" stroke="#8E8E8E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#B4B4B4">Londra ve Tokyo Saatleri</text>
    </g>
    <g transform="translate(14 250)">
      <path d="M24 25 a2 2 0 0 1-2 2 H13 l-3 3 V15 a2 2 0 0 1 2-2 h10 a2 2 0 0 1 2 2 z" fill="none" stroke="#8E8E8E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#B4B4B4">Firestore Yedekleme Planı</text>
    </g>
    <g transform="translate(14 292)">
      <path d="M24 25 a2 2 0 0 1-2 2 H13 l-3 3 V15 a2 2 0 0 1 2-2 h10 a2 2 0 0 1 2 2 z" fill="none" stroke="#8E8E8E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#B4B4B4">Prod Veritabanı İtirazı</text>
    </g>

    <!-- alt kullanıcı barı -->
    <line x1="0" y1="560" x2="290" y2="560" stroke="#2A2A2A" stroke-width="1"/>
    <g transform="translate(18 574)">
      <circle cx="16" cy="16" r="16" fill="#C5A059"/>
      <text x="16" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#121212">B</text>
      <text x="42" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ECECEC">Barış Salih Babacan</text>
      <text x="42" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#737373">Google ile Doğrulandı</text>
    </g>
  </g>

  <!-- ana sohbet alanı (#212121) -->
  <g id="chat-area" transform="translate(290 0)">
    <!-- üst çubuk (56px) -->
    <line x1="0" y1="56" x2="910" y2="56" stroke="#2E2E2E" stroke-width="1"/>
    <g transform="translate(22 18)">
      <rect x="0" y="2" width="18" height="16" rx="2" fill="none" stroke="#B4B4B4" stroke-width="1.8"/>
      <line x1="6" y1="2" x2="6" y2="18" stroke="#B4B4B4" stroke-width="1.8"/>
      <text x="32" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ECECEC">Groq · openai/gpt-oss-120b</text>
    </g>

    <!-- durum rozeti (Ready) -->
    <g transform="translate(796 14)">
      <rect width="92" height="28" rx="14" fill="#292929" stroke="#383838"/>
      <circle cx="18" cy="14" r="4.5" fill="#10B981"/>
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#B4B4B4">Ready</text>
    </g>

    <!-- 1. mesaj çifti: saat sorusu -->
    <g transform="translate(36 78)">
      <!-- kullanıcı balonu (sağda) -->
      <rect x="498" y="0" width="340" height="44" rx="18" fill="#2F2F2F"/>
      <text x="668" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#ECECEC">Londra ve Tokyo'da saat kaç?</text>

      <!-- Alfred cevabı -->
      <g transform="translate(0 58)">
        <circle cx="16" cy="16" r="16" fill="#C5A059"/>
        <path d="M8 20 H24 M10 20 V12 A1 1 0 0 1 11 11 H21 A1 1 0 0 1 22 12 V20 M10 17 H22" fill="none" stroke="#121212" stroke-width="1.8" stroke-linecap="round"/>
        <text x="44" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#C5A059">ALFRED</text>
        <text x="104" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#737373">• 14:20</text>
        <text x="44" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#ECECEC">Şu anda Londra'da saat <tspan font-weight="700">12:20</tspan>, Tokyo'da ise <tspan font-weight="700">20:20</tspan>.</text>
      </g>
    </g>

    <!-- 2. mesaj çifti: web araması ve kaynak linkli markdown -->
    <g transform="translate(36 206)">
      <!-- kullanıcı balonu (sağda) -->
      <rect x="558" y="0" width="280" height="44" rx="18" fill="#2F2F2F"/>
      <text x="698" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#ECECEC">Beşiktaş transfer haberleri.</text>

      <!-- Alfred cevabı -->
      <g transform="translate(0 60)">
        <circle cx="16" cy="16" r="16" fill="#C5A059"/>
        <path d="M8 20 H24 M10 20 V12 A1 1 0 0 1 11 11 H21 A1 1 0 0 1 22 12 V20 M10 17 H22" fill="none" stroke="#121212" stroke-width="1.8" stroke-linecap="round"/>
        <text x="44" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#C5A059">ALFRED</text>
        <text x="104" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#737373">• 14:21 · Tavily haber indeksi (topic: news)</text>

        <text x="44" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#ECECEC">Beşiktaş'ın güncel transfer gündeminde öne çıkan başlıklar:</text>

        <!-- madde 1 -->
        <circle cx="54" cy="74" r="3.5" fill="#C5A059"/>
        <text x="68" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#ECECEC"><tspan font-weight="700">Matvey Kislyak</tspan> – Orta saha takviyesi için 21 yaşındaki oyuncu yeniden gündemde. </text>
        <text x="68" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-style="italic" text-decoration="underline" fill="#E6C887">transfermarkt.com.tr</text>

        <!-- madde 2 -->
        <circle cx="54" cy="136" r="3.5" fill="#C5A059"/>
        <text x="68" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#ECECEC"><tspan font-weight="700">Fares Ghedjemis</tspan> – Ocak ayı kanat takviyesi listesinde adı öne çıkıyor. </text>
        <text x="668" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-style="italic" text-decoration="underline" fill="#E6C887">aspor.com.tr</text>

        <!-- madde 3 -->
        <circle cx="54" cy="174" r="3.5" fill="#C5A059"/>
        <text x="68" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#ECECEC"><tspan font-weight="700">Kemal Kaan Şafak</tspan> – 2026/27 sezonu için kadroya katıldı. </text>
        <text x="530" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-style="italic" text-decoration="underline" fill="#E6C887">bjk.com.tr</text>

        <!-- Kopyala butonu -->
        <g transform="translate(44 202)">
          <rect x="0" y="0" width="11" height="11" rx="2" fill="none" stroke="#8E8E8E" stroke-width="1.6"/>
          <text x="18" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#8E8E8E">Kopyala</text>
        </g>
      </g>
    </g>

    <!-- alt mesaj yazma çubuğu (#2F2F2F) -->
    <g transform="translate(36 534)">
      <rect width="838" height="58" rx="29" fill="#2F2F2F" stroke="#3F3F3F"/>
      <!-- + araçlar ikonu -->
      <path d="M28 21 V37 M20 29 H36" stroke="#B4B4B4" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#757575">Alfred'e mesaj yazın...</text>
      <!-- mikrofon ikonu -->
      <g transform="translate(744 17)" fill="none" stroke="#B4B4B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="1" width="6" height="12" rx="3"/>
        <path d="M3 10 v1 a7 7 0 0 0 14 0 v-1"/>
        <line x1="10" y1="18" x2="10" y2="22"/>
      </g>
      <!-- gönder butonu -->
      <circle cx="806" cy="29" r="19" fill="#C5A059"/>
      <path d="M806 36 V22 M800 28 L806 22 L812 28" fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
