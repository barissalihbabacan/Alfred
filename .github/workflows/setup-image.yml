name: Setup image (Cloud Shell)

# Builds the Cloud Shell image behind the README's "Launch Alfred Setup" button:
# the Cloud Shell base image plus the alfred-setup terminal wizard and the
# /bin/cloudshell_open launcher. Published to GitHub Container Registry; the
# package must be made public once (Package settings → Change visibility).

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - ".cloudshell/**"
      - ".github/workflows/setup-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: setup-image
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alfred-setup" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .cloudshell/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
